plugins {
  id 'java'
}

group = 'com.wcpe'
version = '0.1.0'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test') {
  useJUnitPlatform()
}
