spring:
  application:
    name: rate-feed-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rate_feed}
    username: ${SPRING_DATASOURCE_USERNAME:rate_feed_app}
    password: ${SPRING_DATASOURCE_PASSWORD:rate_feed_app}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: rate_feed
    table: flyway_schema_history
server:
  port: 8084
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
ratefeed:
  cache:
    l1-maximum-size: 10000
    l1-ttl: 5m
    l2-ttl: 1h
    redis-key-prefix: rate:v1
    warmup-enabled: true
