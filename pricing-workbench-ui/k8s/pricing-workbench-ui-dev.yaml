apiVersion: v1
kind: Namespace
metadata:
  name: wcpe-dev
  labels:
    app.kubernetes.io/part-of: world-class-pricing-engine
    environment: dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pricing-workbench-ui-nginx
  namespace: wcpe-dev
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location /api/ {
        proxy_pass http://pricing-bff.wcpe-dev.svc.cluster.local:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-workbench-ui
  namespace: wcpe-dev
  labels:
    app: pricing-workbench-ui
    app.kubernetes.io/part-of: world-class-pricing-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-workbench-ui
  template:
    metadata:
      labels:
        app: pricing-workbench-ui
        app.kubernetes.io/part-of: world-class-pricing-engine
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pricing-workbench-ui
          image: pricing-workbench-ui:0.1.0-local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-workbench-ui
  namespace: wcpe-dev
spec:
  type: ClusterIP
  selector:
    app: pricing-workbench-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
