openapi: 3.1.0
info:
  title: LoanWeft LOS API
  version: v1
  description: Standard MISO-aligned API contracts for LOS pricing, offers, locks, and webhooks.
servers:
  - url: /api/v1/los
security:
  - bearerAuth: []
  - apiKeyAuth: []
  - mutualTls: []
paths:
  /pricing-requests:
    post:
      operationId: createLosPricingRequest
      summary: Submit a LOS loan scenario for async pricing.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/LosSystem'
        - $ref: '#/components/parameters/LosVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LosPricingRequest'
      responses:
        '202':
          description: Pricing job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LosPricingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /pricing-requests/{id}:
    get:
      operationId: getLosPricingRequest
      summary: Get pricing request status and result metadata.
      parameters:
        - $ref: '#/components/parameters/PricingRequestId'
        - $ref: '#/components/parameters/LosSystem'
      responses:
        '200':
          description: Pricing request status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LosPricingResponse'
  /pricing-requests/{id}/offers:
    get:
      operationId: getLosPricingOffers
      summary: Get priced offers for a LOS pricing request.
      parameters:
        - $ref: '#/components/parameters/PricingRequestId'
        - $ref: '#/components/parameters/LosSystem'
      responses:
        '200':
          description: Offers.
          content:
            application/json:
              schema:
                type: object
                required: [pricingRequestId, offers]
                properties:
                  pricingRequestId: { type: string }
                  offers:
                    type: array
                    items: { $ref: '#/components/schemas/LosOffer' }
  /locks:
    post:
      operationId: createLosLock
      summary: Request a LOS rate lock.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/LosSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LosLockRequest' }
      responses:
        '202':
          description: Lock accepted or confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LosLockResponse' }
  /locks/{id}:
    get:
      operationId: getLosLock
      summary: Get LOS lock status.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/LosSystem'
      responses:
        '200':
          description: Lock status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LosLockResponse' }
  /locks/{id}/extend:
    post:
      operationId: extendLosLock
      summary: Extend an existing LOS lock.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/LosSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LosLockExtendRequest' }
      responses:
        '200':
          description: Extended lock.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LosLockResponse' }
  /webhooks:
    post:
      operationId: registerLosWebhook
      summary: Register a LOS webhook endpoint for async events.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/LosSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LosWebhookRegistrationRequest' }
      responses:
        '201':
          description: Registered webhook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LosWebhookRegistrationResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2 client credentials token
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    mutualTls:
      type: mutualTLS
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema: { type: string, minLength: 1 }
      description: Idempotency key for 24-hour replay protection.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string }
    LosSystem:
      name: X-LOS-System
      in: header
      required: true
      schema:
        type: string
        enum: [ENCOMPASS, BYTE, MERIDIANLINK, CALYX]
    LosVersion:
      name: X-LOS-Version
      in: header
      required: false
      schema: { type: string }
    PricingRequestId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid LOS request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing LOS authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    LosPricingRequest:
      type: object
      required: [requestId, loan, pricing, tenantId]
      properties:
        requestId: { type: string }
        tenantId: { type: string }
        callbackUrl: { type: string, format: uri }
        loan: { $ref: '#/components/schemas/LosLoan' }
        pricing: { $ref: '#/components/schemas/LosPricing' }
    LosLoan:
      type: object
      required: [loanPurpose, loanAmount, loanType, termMonths, amortizationType, property, borrowers]
      properties:
        loanPurpose: { type: string, enum: [PURCHASE, REFINANCE, CASH_OUT_REFINANCE] }
        loanAmount: { type: number }
        loanType: { type: string }
        termMonths: { type: integer }
        amortizationType: { type: string }
        property: { $ref: '#/components/schemas/LosProperty' }
        borrowers:
          type: array
          items: { $ref: '#/components/schemas/LosBorrower' }
    LosProperty:
      type: object
      properties:
        address: { type: string }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        county: { type: string }
        propertyType: { type: string }
        occupancy: { type: string }
        units: { type: integer }
        purchasePrice: { type: number }
        appraisedValue: { type: number }
    LosBorrower:
      type: object
      properties:
        borrowerId: { type: string }
        creditScore: { type: integer }
        creditScoreSource: { type: string }
        creditReportDate: { type: string, format: date }
        income: { $ref: '#/components/schemas/BorrowerIncome' }
        assets: { $ref: '#/components/schemas/BorrowerAssets' }
        liabilities: { $ref: '#/components/schemas/BorrowerLiabilities' }
    BorrowerIncome:
      type: object
      properties:
        monthly: { type: number }
        type: { type: string }
    BorrowerAssets:
      type: object
      properties:
        liquid: { type: number }
        retirement: { type: number }
    BorrowerLiabilities:
      type: object
      properties:
        monthlyDebt: { type: number }
    LosPricing:
      type: object
      required: [channel, productFamily, lockPeriodDays, effectiveDate]
      properties:
        channel: { type: string }
        productFamily: { type: string }
        investorPreference:
          type: array
          items: { type: string }
        lockPeriodDays: { type: integer }
        effectiveDate: { type: string, format: date }
    LosPricingResponse:
      type: object
      required: [requestId, pricingRequestId, status, offers, waterfall]
      properties:
        requestId: { type: string }
        pricingRequestId: { type: string }
        status: { type: string, enum: [ACCEPTED, QUEUED, COMPLETED, FAILED, NOT_FOUND] }
        offers:
          type: array
          items: { $ref: '#/components/schemas/LosOffer' }
        waterfall:
          type: array
          items: { $ref: '#/components/schemas/WaterfallStep' }
        completedAt: { type: string, format: date-time }
        statusUrl: { type: string }
        quoteJobId: { type: string }
        correlationId: { type: string }
    LosOffer:
      type: object
      properties:
        offerId: { type: string }
        investor: { type: string }
        investorName: { type: string }
        rate: { type: number }
        price: { type: number }
        points: { type: number }
        apr: { type: number }
        lockPeriodDays: { type: integer }
        lockExpiration: { type: string, format: date }
        llpas:
          type: array
          items: { $ref: '#/components/schemas/LosLlpa' }
        totalAdjustmentPoints: { type: number }
        margin: { type: number }
        marginBps: { type: integer }
        eligibility: { type: string }
        bestExecution: { type: boolean }
        rank: { type: integer }
    LosLlpa:
      type: object
      properties:
        code: { type: string }
        description: { type: string }
        points: { type: number }
    WaterfallStep:
      type: object
      properties:
        step: { type: string }
        input: { type: number }
        operation: { type: string }
        output: { type: number }
    LosLockRequest:
      type: object
      required: [pricingRequestId, offerId, lockPeriodDays, requestedBy]
      properties:
        pricingRequestId: { type: string }
        offerId: { type: string }
        lockPeriodDays: { type: integer }
        requestedBy: { type: string }
    LosLockExtendRequest:
      type: object
      required: [extendByDays, requestedBy]
      properties:
        extendByDays: { type: integer, minimum: 1 }
        requestedBy: { type: string }
        reason: { type: string }
    LosLockResponse:
      type: object
      properties:
        lockId: { type: string }
        pricingRequestId: { type: string }
        offerId: { type: string }
        status: { type: string, enum: [CONFIRMED, EXTENDED, EXPIRED, FAILED] }
        lockExpiration: { type: string, format: date-time }
        investor: { type: string }
        investorLockReference: { type: string }
        terms: { $ref: '#/components/schemas/LockTerms' }
        correlationId: { type: string }
    LockTerms:
      type: object
      properties:
        rate: { type: number }
        price: { type: number }
        points: { type: number }
    LosWebhookRegistrationRequest:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum: [pricing.completed, pricing.failed, lock.confirmed, lock.expired, lock.extended, rate.changed]
        secret: { type: string, writeOnly: true }
        tenantId: { type: string }
    LosWebhookRegistrationResponse:
      type: object
      properties:
        webhookId: { type: string }
        tenantId: { type: string }
        url: { type: string }
        events:
          type: array
          items: { type: string }
        status: { type: string }
        registeredAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
