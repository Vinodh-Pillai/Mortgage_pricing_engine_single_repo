logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
logging.pattern.level=%5p [%X{correlation_id},%X{request_id}] %-40.40logger{39}: %m%n

# Outbox pattern configuration
wcpe.audit.outbox.publisher.enabled=true
wcpe.audit.outbox.publisher.poll-interval-ms=1000
wcpe.audit.outbox.publisher.batch-size=50
wcpe.audit.outbox.publisher.max-attempts=5
wcpe.audit.outbox.publisher.initial-backoff-ms=1000
wcpe.audit.outbox.publisher.max-backoff-ms=60000
wcpe.audit.outbox.publisher.backoff-multiplier=2.0
wcpe.audit.outbox.publisher.jitter-factor=0.1
wcpe.audit.outbox.kafka.topic=pricing.audit.events.v1
wcpe.audit.outbox.kafka.dlq-topic=pricing.audit.events.dlq.v1
wcpe.audit.outbox.kafka.client-id=audit-replay-publisher
wcpe.audit.outbox.encryption.enabled=false
wcpe.audit.outbox.encryption.algorithm=AES-256-GCM
