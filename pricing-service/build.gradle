plugins {
  id 'java'
}

group = 'com.wcpe'
version = '0.1.0'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
  testImplementation 'com.networknt:json-schema-validator:1.0.87'
  testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
}

tasks.named('test') {
  useJUnitPlatform()
}

tasks.register('contractTest', Test) {
  group = 'verification'
  description = 'Runs pricing-service API/event/golden contract tests.'
  useJUnitPlatform()
  include '**/*ContractTest.class'
  include '**/*ContractSuiteTest.class'
  include '**/*EventSchemaCompatibilityTest.class'
  shouldRunAfter tasks.named('test')
}
