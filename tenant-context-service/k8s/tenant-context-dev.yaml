apiVersion: v1
kind: Namespace
metadata:
  name: wcpe-dev
  labels:
    app.kubernetes.io/part-of: world-class-pricing-engine
    environment: dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-context-service-config
  namespace: wcpe-dev
data:
  SPRING_PROFILES_ACTIVE: dev
  SERVER_PORT: "8080"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
  WCPE_SYNTHETIC_ONLY: "true"
  TENANT_CONTEXT_DB_URL: jdbc:postgresql://catalog-postgres.wcpe-dev.svc.cluster.local:5432/catalog
  TENANT_CONTEXT_DB_USERNAME: catalog_app
  AUTH_JWT_SECRET: dev-only-tenant-context-secret-change-before-shared-use
  TENANT_CONTEXT_FLYWAY_ENABLED: "true"
  SPRING_FLYWAY_TABLE: tenant_context_flyway_schema_history
  SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-context-service
  namespace: wcpe-dev
  labels:
    app: tenant-context-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-context-service
  template:
    metadata:
      labels:
        app: tenant-context-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tenant-context-service
          image: tenant-context-service:0.1.0-local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tenant-context-service-config
          env:
            - name: TENANT_CONTEXT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-context-service
  namespace: wcpe-dev
spec:
  type: ClusterIP
  selector:
    app: tenant-context-service
  ports:
    - name: http
      port: 8080
      targetPort: http
