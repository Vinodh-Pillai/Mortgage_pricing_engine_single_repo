apiVersion: v1
kind: Namespace
metadata:
  name: wcpe-dev
  annotations:
    wcpe.codefactory/deployment-policy: blocked-without-explicit-non-prod-approval
  labels:
    app.kubernetes.io/part-of: world-class-pricing-engine
    environment: dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quote-service-config
  namespace: wcpe-dev
data:
  SPRING_PROFILES_ACTIVE: dev
  SERVER_PORT: "8080"
  SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-postgres.wcpe-dev.svc.cluster.local:5432/catalog?currentSchema=quote,public
  SPRING_DATASOURCE_USERNAME: catalog_app
  QUOTE_FLYWAY_ENABLED: "true"
  SPRING_FLYWAY_SCHEMAS: quote
  SPRING_FLYWAY_DEFAULT_SCHEMA: quote
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
  WCPE_SYNTHETIC_ONLY: "false"
  WCPE_ADJUSTMENT_SERVICE_BASE_URL: http://adjustment-service.wcpe-dev.svc.cluster.local:8080
  QUOTE_LOANHOUSE_CAPTURE_LOADER_ENABLED: "true"
  QUOTE_LOANHOUSE_CAPTURE_LOADER_TENANT_ID: 11111111-1111-1111-1111-111111111111
  QUOTE_LOANHOUSE_CAPTURE_LOADER_RESOURCE: classpath:loanhouse/product-records.json
  QUOTE_LOANPASS_SYNTHETIC_LOADER_ENABLED: "true"
  QUOTE_LOANPASS_SYNTHETIC_LOADER_TENANT_ID: 11111111-1111-1111-1111-111111111111
  QUOTE_LOANPASS_SYNTHETIC_LOADER_PRODUCT_COUNT: "1536"
  QUOTE_LOANPASS_SYNTHETIC_LOADER_SEED: PII-17-S07-pricing-load-test-seed-v1
  QUOTE_SYNTHETIC_DEPENDENCIES_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-service
  namespace: wcpe-dev
  labels:
    app: quote-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote-service
  template:
    metadata:
      labels:
        app: quote-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: quote-service
          image: 192.168.4.102:32061/mortgage-pricing/quote-service:0.1.0-inc5-quote-repeat-fix-20260701T150317Z-amd64
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: quote-service-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: quote-service
  namespace: wcpe-dev
spec:
  type: ClusterIP
  selector:
    app: quote-service
  ports:
    - name: http
      port: 8080
      targetPort: http
