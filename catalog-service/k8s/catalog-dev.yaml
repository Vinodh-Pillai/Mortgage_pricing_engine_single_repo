apiVersion: v1
kind: Namespace
metadata:
  name: wcpe-dev
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-secret
  namespace: wcpe-dev
type: Opaque
stringData:
  POSTGRES_DB: catalog
  POSTGRES_USER: catalog_app
  POSTGRES_PASSWORD: catalog_app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-service-config
  namespace: wcpe-dev
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-postgres.wcpe-dev.svc.cluster.local:5432/catalog
  SPRING_DATASOURCE_USERNAME: catalog_app
  SERVER_PORT: "8082"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-postgres-data
  namespace: wcpe-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-postgres
  namespace: wcpe-dev
spec:
  serviceName: catalog-postgres
  replicas: 1
  selector:
    matchLabels:
      app: catalog-postgres
  template:
    metadata:
      labels:
        app: catalog-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: catalog-db-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "catalog_app", "-d", "catalog"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "catalog_app", "-d", "catalog"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: catalog-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-postgres
  namespace: wcpe-dev
spec:
  clusterIP: None
  selector:
    app: catalog-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: wcpe-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: 192.168.4.93:5000/catalog-service:0.1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: catalog-service-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: wcpe-dev
spec:
  selector:
    app: catalog-service
  ports:
    - name: http
      port: 8082
      targetPort: http
