spring:
  application:
    name: scenario-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scenario}
    username: ${SPRING_DATASOURCE_USERNAME:scenario_app}
    password: ${SPRING_DATASOURCE_PASSWORD:scenario_app}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8081
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
