plugins {
  id 'java'
}

group = 'com.wcpe'
version = '0.1.0'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test') {
  useJUnitPlatform()
}

tasks.register('contractTest', Test) {
  description = 'Runs integration contract tests for API, event, fixture, redaction, and tenant isolation contracts.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  include '**/*ContractTest.class'
  shouldRunAfter tasks.named('test')
}

tasks.named('check') {
  dependsOn tasks.named('contractTest')
}
