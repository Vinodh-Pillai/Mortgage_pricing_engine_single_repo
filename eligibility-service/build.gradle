plugins {
  id 'java'
  id 'org.springframework.boot' version '3.3.5'
  id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.wcpe'
version = '0.1.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

ext {
  testcontainersVersion = '1.21.3'
  dockerBackedDockerApiVersion = providers.environmentVariable('DOCKER_API_VERSION').orElse('1.44')
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'io.micrometer:micrometer-core'
  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-database-postgresql'
  runtimeOnly 'org.postgresql:postgresql'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
  testImplementation 'org.testcontainers:postgresql'
  testImplementation 'org.testcontainers:junit-jupiter'

}

tasks.named('test') {
  useJUnitPlatform()
  if (System.getenv('CI') == 'true') {
    systemProperty 'eligibility.enforceDockerTests', 'true'
  }
}

tasks.register('dockerBackedTest', Test) {
  description = 'Runs eligibility tests with Docker/Testcontainers availability enforced.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform()
  systemProperty 'eligibility.enforceDockerTests', 'true'
  systemProperty 'api.version', dockerBackedDockerApiVersion.get()
  shouldRunAfter tasks.named('test')
}
