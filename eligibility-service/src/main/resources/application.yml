spring:
  application:
    name: eligibility-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eligibility}
    username: ${SPRING_DATASOURCE_USERNAME:eligibility_app}
    password: ${SPRING_DATASOURCE_PASSWORD:eligibility_app}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: eligibility
    table: flyway_schema_history
server:
  port: 8083
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
